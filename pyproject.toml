[tool.poetry]
name = "event-management-platform"
version = "0.1.0"
description = "Event management platform backend"
authors = ["you <you@example.com>"]
readme = "README.md"
packages = [{ include = "app" }, { include = "agent" }, { include = "scripts" }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115"
uvicorn = { extras = ["standard"], version = "^0.30" }
sqlalchemy = "^2.0"
psycopg = { extras = ["binary"], version = "^3.2" }
alembic = "^1.13"
pydantic-settings = "^2.5"
# In-process LLM inference for the intent classifier (no Ollama server needed).
# `source` pins it to the prebuilt CPU wheel index below, so Poetry installs a
# wheel instead of compiling llama.cpp from source (which needs cmake/gcc).
llama-cpp-python = { version = "^0.3.2", source = "llama-cpp-python-cpu" }
# Required by Llama.from_pretrained to fetch/ locate the GGUF on the Hub; not a
# transitive dep of llama-cpp-python's base install.
huggingface-hub = "^0.27"

# Prebuilt CPU wheels for llama-cpp-python (avoids a slow source build).
# `explicit` = only used by packages that name it (i.e. llama-cpp-python above);
# PyPI stays the default for everything else.
[[tool.poetry.source]]
name = "llama-cpp-python-cpu"
url = "https://abetlen.github.io/llama-cpp-python/whl/cpu"
priority = "explicit"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
# httpx: used by the agent's HTTP client (agent/tools.py, agent/classifier.py)
# and the FastAPI TestClient. Tests/chat run via `docker compose run`, which
# uses the dev environment, so it stays a dev dependency (no lockfile churn).
httpx = "^0.27"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests", "agent/tests"]
