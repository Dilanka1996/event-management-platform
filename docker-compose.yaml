services:
  db:
    image: postgres:18
    container_name: emp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-emp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-emp}
      POSTGRES_DB: ${POSTGRES_DB:-emp}
      # Postgres 18 keeps data in a major-version subdir, so mount the parent.
      PGDATA: /var/lib/postgresql/18/docker
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      # *.sql / *.sh here run once on first init of an empty data dir.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-emp} -d ${POSTGRES_DB:-emp}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Backend runs the intent-classifier LLM IN-PROCESS (llama-cpp-python, Qwen2.5
  # GGUF) — no Ollama server, no sidecar, no exposed model port.
  backend:
    build: .
    container_name: emp-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-emp}:${POSTGRES_PASSWORD:-emp}@db:5432/${POSTGRES_DB:-emp}
      # In-process LLM config (see agent/classifier.py).
      LLM_MODEL: ${LLM_MODEL:-Qwen/Qwen2.5-1.5B-Instruct-GGUF}
      LLM_MODEL_FILE: ${LLM_MODEL_FILE:-qwen2.5-1.5b-instruct-q4_k_m.gguf}
    ports:
      - "8000:8000"
    # Bind-mount source so uvicorn --reload picks up host edits live.
    volumes:
      - ./app:/app/app
      - ./agent:/app/agent
      - ./scripts:/app/scripts
      - ./tests:/app/tests
      # Cache the downloaded GGUF across rebuilds (avoids re-downloading ~1GB).
      - hf_cache:/root/.cache/huggingface
volumes:
  pgdata:
  hf_cache:

