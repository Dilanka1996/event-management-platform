services:
  db:
    image: postgres:18
    container_name: emp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-emp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-emp}
      POSTGRES_DB: ${POSTGRES_DB:-emp}
      # Postgres 18 keeps data in a major-version subdir, so mount the parent.
      PGDATA: /var/lib/postgresql/18/docker
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      # *.sql / *.sh here run once on first init of an empty data dir.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-emp} -d ${POSTGRES_DB:-emp}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Backend: FastAPI + the agent. The intent-classifier LLM is the hosted
  # OpenAI API (called over the network), so there is no local model service.
  backend:
    build: .
    container_name: emp-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-emp}:${POSTGRES_PASSWORD:-emp}@db:5432/${POSTGRES_DB:-emp}
      # The agent (chat CLI, agent-eval, tests) talks to the platform API.
      # Inside the compose network the server is reachable by SERVICE NAME, not
      # localhost — a `docker compose run backend ...` client container is NOT
      # the server container, so localhost:8000 would hit itself (nothing there).
      EMP_BASE_URL: ${EMP_BASE_URL:-http://backend:8000}
      EMP_TOKEN: ${EMP_TOKEN:-tok_1}
            # OpenAI config (see agent/classifier.py). LLM_MODEL defaults to
      # gpt-4o-mini. OPENAI_API_KEY is required at runtime — pass it via the
      # shell or a .env file, never commit it.
      # NOTE: OPENAI_BASE_URL is intentionally NOT set here. An empty value
      # makes the OpenAI SDK build a scheme-less request URL ("missing an
      # 'http://' or 'https://' protocol"); leave it unset and the SDK uses
      # https://api.openai.com/v1. Set it explicitly only for a compatible
      # endpoint — e.g. add `OPENAI_BASE_URL=https://...` to your .env.
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "8000:8000"
    # Bind-mount source so uvicorn --reload picks up host edits live.
    volumes:
      - ./app:/app/app
      - ./agent:/app/agent
      - ./scripts:/app/scripts
      - ./tests:/app/tests
volumes:
  pgdata:
